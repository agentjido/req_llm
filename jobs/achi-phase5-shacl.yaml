  name: "ACHI Phase 5: SHACL Constraint Validation (Q)"
  description: "Define SHACL shapes and runtime validators for semantic validation"
  phase: quality
  tool: shacl

metadata:
  project: req_llm
  methodology: ACHI
  phase_number: 5
  phase_name: "Q (SHACL)"
  date_started: "2025-11-10"
  date_completed: "2025-11-10"
  depends_on: achi-phase4-gitvan

artifacts:
  inputs:
    - path: graph/reqllm.ttl
      type: rdf-turtle-composed
      hash: "c0b085bd0214"
      description: "Composed ontology from Phase 1"

    - path: lib/req_llm/orchestrator/
      type: elixir-modules
      description: "6 orchestrator modules from Phase 2"

  outputs:
    - path: ontologies/reqllm.shapes.ttl
      lines: 679
      type: shacl-turtle
      shapes:
        base_ontology: 11
        orchestrator: 6
        cross_property: 2
      description: "SHACL constraint shapes for all req_llm classes"

    - path: lib/req_llm/ontology/validator.ex
      lines: 522
      type: elixir-module
      functions: 14
      description: "Runtime Elixir validation module"

constraints:
  base_ontology:
    - Message: "role, hasPart (min 1), position (non-negative)"
    - ContentPart: "Type-specific constraints (TextPart, ImageURLPart, etc.)"
    - Response: "hasContext, hasMessageOut, finishReason (enum), hasUsage"
    - Context: "hasMessage (min 1), externalId"
    - Usage: "Token counts (non-negative), costs (non-negative)"
    - Model: "provider, modelName, temperature (0-2), maxTokens (>0)"
    - Tool: "name, description, parameterSchema"

  orchestrator_constraints:
    - BudgetPolicy:
        maxTotalCostUSD: "0 < x <= 100 USD"
        maxLatencyMs: "0 < x <= 300000 ms (5 minutes)"

    - RetryPolicy:
        maxAttempts: "1 <= x <= 10"
        backoffMs: "100 <= x <= 60000 ms (1 minute)"
        backoffMultiplier: "x >= 1.0 (exponential growth)"

    - ProviderCandidate:
        providerName: "non-empty string (required)"
        priority: "0 <= x <= 999 (0 = highest)"
        estimatedCost: "x >= 0.0 (optional)"

    - CallPlan:
        hasBudgetPolicy: "exactly 1 (required)"
        hasRetryPolicy: "exactly 1 (required)"
        hasContext: "exactly 1 (required)"
        hasCandidate: "min 1 (required)"

    - Attempt:
        sequence: "x >= 0 (0 = first attempt)"
        providerName: "non-empty string (required)"
        startedAtMs: "x >= 0 (Unix epoch ms)"
        durationMs: "x >= 0 (optional)"

    - Failure:
        reason: "non-empty string (required)"
        retryable: "boolean (required)"
        timestampMs: "x >= 0 (Unix epoch ms, optional)"

  cross_property_constraints:
    - CallPlanBudgetConsistency:
        sparql: "At least one candidate with estimatedCost <= maxTotalCostUSD"
        severity: "violation"

    - RetryBudgetWarning:
        sparql: "High retry attempts (>5) with strict budget (<$1) warning"
        severity: "warning"

execution:
  method: manual-constraint-design
  pattern: "SHACL Shape → Elixir Validator → Runtime Check"

  validators:
    - validate_response/1
    - validate_context/1
    - validate_message/1
    - validate_part/1
    - validate_usage/1
    - validate_budget_policy/1
    - validate_retry_policy/1
    - validate_provider_candidate/1
    - validate_call_plan/1
    - validate_attempt/1
    - validate_failure/1
    - validate_call_plan_deep/1

  statistics:
    shacl_shapes_lines: 679
    validator_lines: 522
    total_lines: 1201
    shapes_defined: 19
    validators_defined: 14
    cross_property_constraints: 2

