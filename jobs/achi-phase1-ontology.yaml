      hash: "c0b085bd0214"
      validation: manual-inspection

  scripts:
    - path: script/compose_ontology.sh
      type: bash
      description: "Manual composition script (unrdf dependency workaround)"

execution:
  command: "./script/compose_ontology.sh"
  working_directory: "/Users/speed/sean/req_llm"
  environment:
    ONTOLOGIES_DIR: "ontologies"
    OUTPUT_FILE: "graph/reqllm.ttl"

  success_criteria:
    - exit_code: 0
    - file_exists: "graph/reqllm.ttl"
