name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - elixir: '1.18.0'
            otp: '27.0'
            lint: true
          - elixir: '1.17.3'
            otp: '26.2'
            lint: false
    
    env:
      MIX_ENV: test
      # Use cached fixtures instead of live API calls in CI
      LIVE: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}
    
    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          _build
          deps
        key: ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ matrix.elixir }}-${{ matrix.otp }}-
          ${{ runner.os }}-mix-
    
    - name: Install dependencies
      run: |
        mix local.hex --force
        mix local.rebar --force
        mix deps.get
    
    - name: Compile project
      run: mix compile --warnings-as-errors
    
    - name: Check code formatting
      run: mix format --check-formatted
      if: matrix.lint
    
    - name: Run Credo
      run: mix credo --strict
      if: matrix.lint
    
    - name: Cache PLT files for Dialyzer
      uses: actions/cache@v4
      if: matrix.lint
      with:
        path: |
          ~/.dialyzer_core_*.plt
          .dialyzer_*.plt
        key: ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-plt-${{ matrix.elixir }}-${{ matrix.otp }}-
          ${{ runner.os }}-plt-
    
    - name: Run Dialyzer
      run: mix dialyzer
      if: matrix.lint
    
    - name: Run tests
      run: mix test